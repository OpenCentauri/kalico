name: CC1 Firmware Build

on:
  workflow_dispatch:
  push:
    branches:
      - open-centauri

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - name: dsp
            config: config/cc1-build/config.dsp
            source: out/klipper.elf
            output: dsp.elf
            toolchain: xtensa-hifi4
          - name: hotend
            config: config/cc1-build/config.hotend
            source: out/klipper.bin
            output: hotend.bin
            toolchain: arm-none-eabi
          - name: bed
            config: config/cc1-build/config.bed
            source: out/klipper.bin
            output: bed.bin
            toolchain: arm-none-eabi

    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        if: matrix.toolchain == 'arm-none-eabi'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi

      - name: Install Xtensa HiFi4 toolchain
        if: matrix.toolchain == 'xtensa-hifi4'
        run: |
          curl -L -o toolchain.tar.xz https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.17.4/toolchain_linux-x86_64_xtensa-nxp_rt700_hifi4_zephyr-elf.tar.xz
          mkdir -p $HOME/xtensa-toolchain
          tar -xf toolchain.tar.xz -C $HOME/xtensa-toolchain
          echo "$HOME/xtensa-toolchain/xtensa-nxp_rt700_hifi4_zephyr-elf/bin" >> $GITHUB_PATH

      - name: Build ${{ matrix.name }}
        run: |
          cp ${{ matrix.config }} .config
          make olddefconfig
          make

      - name: Rename output
        run: |
          cp ${{ matrix.source }} ${{ matrix.output }}

      - name: Upload ${{ matrix.name }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}
          if-no-files-found: error
          retention-days: 30

  collect-artifacts:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: firmware
          merge-multiple: true

      - name: Create combined zip
        run: |
          zip -j cc1-firmware-all.zip firmware/bed.bin firmware/hotend.bin firmware/dsp.elf

      - name: Upload combined artifact
        uses: actions/upload-artifact@v4
        with:
          name: cc1-firmware-all
          path: cc1-firmware-all.zip
          if-no-files-found: error
          retention-days: 30
